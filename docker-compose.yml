services:
  postgres:
    image: postgres:16
    container_name: rempatia-postgres
    environment:
      POSTGRES_USER: rempatia
      POSTGRES_PASSWORD: rempatia
      POSTGRES_DB: rempatia
    ports:
      - "5432:5432"
    volumes:
      - rempatia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rempatia -d rempatia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rempatia_pgdata:
